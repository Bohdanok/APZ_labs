syntax = "proto3";

package logging;

service LoggingService {
  rpc LogMessage (LogRequest) returns (LogResponse) {}
  rpc GetMessages (EmptyRequest) returns (MessagesResponse) {}
}

message LogRequest {
  string uuid = 1;
  string msg = 2;
}

message LogResponse {
  string status = 1;
}

message EmptyRequest {}

message MessagesResponse {
  string messages = 1;
}