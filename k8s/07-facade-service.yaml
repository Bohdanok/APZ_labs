# Facade is the only externally-reachable service - exposed via NodePort 30080.
apiVersion: v1
kind: Service
metadata:
  name: facade-service
  namespace: apz-lab5
spec:
  type: NodePort
  selector:
    app: facade-service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: facade-service
  namespace: apz-lab5
spec:
  replicas: 2
  selector:
    matchLabels:
      app: facade-service
  template:
    metadata:
      labels:
        app: facade-service
    spec:
      containers:
        - name: facade-service
          image: apz-lab5/facade-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 10
