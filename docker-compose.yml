version: "3.8"

networks:
  micro-net:
    driver: bridge

services:
  hazelcast1:
    image: hazelcast/hazelcast:5.3
    container_name: hz1
    networks:
      - micro-net
    ports:
      - "5701:5701"
    environment:
      - HZ_CLUSTERNAME=dev

  hazelcast2:
    image: hazelcast/hazelcast:5.3
    container_name: hz2
    networks:
      - micro-net
    ports:
      - "5702:5701"
    environment:
      - HZ_CLUSTERNAME=dev

  hazelcast3:
    image: hazelcast/hazelcast:5.3
    container_name: hz3
    networks:
      - micro-net
    ports:
      - "5703:5701"
    environment:
      - HZ_CLUSTERNAME=dev

  postgres:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: messages_db
    ports:
      - "5432:5432"
    networks:
      - micro-net
    volumes:
      - pgdata:/var/lib/postgresql/data

  logging-service-1:
    build:
      context: .
      dockerfile: ./logging-service/Dockerfile
    container_name: ls1
    environment:
      - HZ_NODES=hz1:5701,hz2:5701,hz3:5701
    networks:
      - micro-net
    depends_on:
      - hazelcast1

  logging-service-2:
    build:
      context: .
      dockerfile: ./logging-service/Dockerfile
    container_name: ls2
    environment:
      - HZ_NODES=hz1:5701,hz2:5701,hz3:5701
    networks:
      - micro-net
    depends_on:
      - hazelcast2

  logging-service-3:
    build:
      context: .
      dockerfile: ./logging-service/Dockerfile
    container_name: ls3
    environment:
      - HZ_NODES=hz1:5701,hz2:5701,hz3:5701
    networks:
      - micro-net
    depends_on:
      - hazelcast3

  counter-service:
    build:
      context: .
      dockerfile: ./counter-service/Dockerfile
    container_name: cs
    environment:
      - DB_HOST=postgres
      - DB_USER=user
      - DB_PASS=password
      - DB_NAME=messages_db
    networks:
      - micro-net
    depends_on:
      - postgres

  facade-service:
    build:
      context: .
      dockerfile: ./facade-service/Dockerfile
    container_name: fs
    ports:
      - "8000:8000"
    environment:
      - LOGGING_NODES=http://ls1:8000,http://ls2:8000,http://ls3:8000
      - MESSAGES_URL=http://cs:8000/message
    networks:
      - micro-net

volumes:
  pgdata: